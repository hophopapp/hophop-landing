<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOP</title>
  <meta name="description" content="Welcome to HOP. Order as a customer or manage your business as a merchant.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: #666666;
      --accent: #111111;
      --accent-fg: #ffffff;
      --border: #dddddd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f5f5f5;
        --muted: #a0a0a0;
        --accent: #f5f5f5;
        --accent-fg: #111111;
        --border: #333333;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 3rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 32px; font-size: 1.1rem; }
    .actions { display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      padding: 16px 24px;
      border-radius: 12px;
      border: 1px solid var(--accent);
      font-size: 1.05rem;
      font-weight: 600;
      text-decoration: none;
    }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .btn.secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn:hover, .btn:focus-visible { opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <h1>HOP</h1>
    <p>Welcome! Choose where you'd like to go.</p>
    <div class="actions">
      <a class="btn primary" href="https://user.hopapp.com.au">User App</a>
      <a class="btn secondary" href="https://merchant.hopapp.com.au">Merchant App</a>
    </div>
  </main>
</body>
</html>
